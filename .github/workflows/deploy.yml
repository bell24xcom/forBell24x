# Bell24H Deployment
# Vercel handles auto-deployment when connected to the GitHub repo.
# This workflow verifies the production build compiles in CI without a live DB.
#
# Previous setup: Oracle VM at 80.225.192.248 (expired Feb 2026)
# Current setup: Vercel (https://vercel.com)

name: Verify Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-check:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://www.bell24h.com
      # Required by prisma/schema.prisma; migrate deploy is skipped in build:ci.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build:ci

      - name: Build Status
        if: success()
        run: |
          echo "Build successful! Vercel will deploy automatically."
          echo "Live at: https://bell24h.com"
