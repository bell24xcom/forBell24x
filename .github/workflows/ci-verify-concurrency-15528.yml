name: Payment Concurrency Check (temporary, 15.5.28 verification)

on:
  push:
    branches:
      - fix/nextjs-avif-rce-ghsa-2xp9

jobs:
  concurrency-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (exact lockfile)
        run: npm ci --legacy-peer-deps

      - name: Prisma generate (schema only, no DB connection)
        run: npx prisma generate

      - name: Run the committed concurrency test, unmodified
        run: npm run test:payment-concurrency
