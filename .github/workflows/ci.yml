name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    env:
      # Prisma schema references these env vars; CI does not run migrate deploy.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      NEXT_PUBLIC_SITE_URL: https://www.vyaparsethu.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prisma generate
        run: npx prisma generate

      # Full-repo `tsc --noEmit` fails on pre-existing legacy paths (traffic,
      # voicebot, root components/, tests). CI scopes typecheck to maintained
      # outreach modules; production compile gate is build:ci (next build).
      - name: TypeScript check (CI scope)
        run: npm run typecheck:ci

      - name: Outreach unit tests
        run: npm run test:outreach

      - name: Quote-token security unit tests
        run: npm run test:quote-token

      - name: PR63 marketplace security regression suite
        run: npm run test:security

      # D-ENG-05 (docs/SEO_DECISIONS.md) — CLAUDE.md's documented "<=12
      # serverless functions" rule is unverified against the actual Vercel
      # plan/ceiling and contradicted by the 200+ route.ts files already in
      # this repo (confirmed shipping via deployment bell24h-339udlwh9).
      # This step does NOT enforce that number — it only alerts if the
      # count grows past the H6-13 baseline, so a real ceiling (once
      # verified) doesn't get silently exceeded between now and whenever
      # D-ENG-05 is resolved. Non-blocking by design.
      - name: Route count guard (D-ENG-05 baseline, informational only)
        run: |
          BASELINE=206
          COUNT=$(find src/app/api -iname "route.ts" | wc -l)
          echo "route.ts count: $COUNT (H6-13 baseline: $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::warning::Serverless route count grew from $BASELINE to $COUNT since H6-13. See D-ENG-05 (docs/SEO_DECISIONS.md) — confirm the real Vercel ceiling before this keeps growing."
          fi

      - name: Next.js build (CI)
        run: npm run build:ci
