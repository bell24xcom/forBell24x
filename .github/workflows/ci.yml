name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prisma generate
        run: npx prisma generate

      - name: TypeScript check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build
        env:
          # next.config.js still has ignoreBuildErrors:true as a safety net,
          # but the tsc step above is the real type gate.
          NEXT_PUBLIC_SITE_URL: https://www.vyaparsethu.com
