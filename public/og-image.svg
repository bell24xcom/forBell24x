<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A5F;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Logo box -->
  <rect x="480" y="120" width="100" height="100" rx="20" fill="#06B6D4"/>
  <text x="530" y="190" font-family="Arial Black, sans-serif" font-size="64" font-weight="900" fill="white" text-anchor="middle">B</text>
  <!-- Brand name -->
  <text x="600" y="310" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="white" text-anchor="middle">BELL 24H</text>
