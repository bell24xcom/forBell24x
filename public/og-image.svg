  <text x="600" y="480" font-family="Arial, sans-serif" font-size="22" fill="#06B6D4" text-anchor="middle">₹500Cr+ Transactions</text>
  <text x="900" y="480" font-family="Arial, sans-serif" font-size="22" fill="#06B6D4" text-anchor="middle">450+ Categories</text>
